name = "sunny"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true
# No extra per-version preview URLs: one public address only.
preview_urls = false

# Frontend (web/dist) and API are served by this one Worker on one HTTPS URL.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "sunny"
# Paste the id printed by `npx wrangler d1 create sunny`.
database_id = "8632bbb7-7e7e-48a7-aed3-4e7d699579cd"
migrations_dir = "migrations"

# Check reminders every minute.
[triggers]
crons = ["* * * * *"]

[vars]
# From `node scripts/generate-vapid.mjs`. The private key is a secret:
#   npx wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:you@example.com"
